# 3g, not 8g: the heavy tasks (exportLlamaIree) fork their own JVMs with their own -Xmx, so the
# daemon never needed 8g — and an 8g daemon simply fails to start on the 8 GB Arm64 machines this
# project is meant to be reproducible on (Raspberry Pi 5, small Graviton). Raise locally if needed.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
kotlin.code.style=official
kotlin.mpp.stability.nowarn=true

