[versions]
kotlin = "2.3.21"
# SKaiNET transformers BOM. 0.32.0 carries the IREE fix-stack (packed NATIVE_OPTIMIZED
# Llama, fused decode-attention, traceable RoPE). 0.32.1 fixes streaming detokenization
# (per-token decode keeps word-boundary spaces, via engine 0.32.4 Tokenizer.decodeToken)
# and ships against engine 0.32.4, which we also import via the core BOM below.
transformers = "0.32.1"
# Core released ahead of transformers; 0.32.0 adds the new StableHLO export framework
# (StableHloGraphExporter, operation registry, external-parameter handling). 0.32.4 is
# the latest published release: ExecutionContext.isRecording (0.32.2) + graph-output
# pruning (ComputeGraph.prunedToOutputs, 0.32.3) + Tokenizer.decodeToken (0.32.4) used
# by transformers 0.32.1 streaming detok.
core = "0.32.4"
coroutines = "1.11.0"
kotlinx-io = "0.9.0"

[libraries]
skainet-transformers-bom = { module = "sk.ainet.transformers:skainet-transformers-bom", version.ref = "transformers" }
skainet-bom = { module = "sk.ainet:skainet-bom", version.ref = "core" }
skainet-transformers-core = { module = "sk.ainet.transformers:skainet-transformers-core" }
skainet-transformers-inference-llama = { module = "sk.ainet.transformers:skainet-transformers-inference-llama" }
skainet-transformers-runtime-kllama = { module = "sk.ainet.transformers:skainet-transformers-runtime-kllama" }
skainet-backend-cpu = { module = "sk.ainet.core:skainet-backend-cpu" }
skainet-backend-native-cpu = { module = "sk.ainet.core:skainet-backend-native-cpu" }
skainet-compile-dag = { module = "sk.ainet.core:skainet-compile-dag" }
skainet-compile-hlo = { module = "sk.ainet.core:skainet-compile-hlo" }
skainet-compile-opt = { module = "sk.ainet.core:skainet-compile-opt" }
skainet-io-core = { module = "sk.ainet.core:skainet-io-core" }
skainet-io-gguf = { module = "sk.ainet.core:skainet-io-gguf" }
skainet-lang-core = { module = "sk.ainet.core:skainet-lang-core" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-io-core = { module = "org.jetbrains.kotlinx:kotlinx-io-core", version.ref = "kotlinx-io" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
