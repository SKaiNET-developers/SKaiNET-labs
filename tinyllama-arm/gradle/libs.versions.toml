[versions]
# 2.4.10 matches the compiler that produced the SKaiNET 0.39.x klibs (ABI 2.4.0 —
# a 2.3.x compiler cannot consume them).
kotlin = "2.4.10"
# SKaiNET transformers BOM. Since 0.36.0 the board-fit work (fused load+pack + PhaseProfile,
# upstream PR #220) ships in the release, so a plain Maven Central build is enough — the
# -PuseLocalSkainet composite is only for testing unreleased sibling work. 0.39.1 is
# lock-step with engine 0.39.1 — KEEP IT LOCK-STEP, see the core comment below.
transformers = "0.39.1"
# Core BOM. STAY ON 0.39.1 — verified 2026-08-13 (deterministic golden-output check, not
# just compile): core 0.40.1's ops.transpose rewrite (upstream #968/#969, "physically
# reorder packed-quant blocks") produces garbage decode output ("КоКоКоКоКо…") against
# transformers 0.39.1's Llama loader, even though everything still compiles clean. 0.40.0
# (pre-fix) is fine paired with transformers 0.39.1, so the break is specifically that
# commit, not the 0.39->0.40 jump generally — but no transformers release has absorbed the
# new contract yet, so don't take core past 0.39.1 until one does. Re-verify with the
# eager-jvm golden run (README Tier 1), not just a compile check, before ever bumping this
# again — a clean scratch-home compile does NOT catch this class of regression.
core = "0.39.1"
coroutines = "1.11.0"
kotlinx-io = "0.9.0"

[libraries]
skainet-transformers-bom = { module = "sk.ainet.transformers:skainet-transformers-bom", version.ref = "transformers" }
skainet-bom = { module = "sk.ainet:skainet-bom", version.ref = "core" }
skainet-transformers-core = { module = "sk.ainet.transformers:skainet-transformers-core" }
skainet-transformers-transformer-core = { module = "sk.ainet.transformers:skainet-transformers-transformer-core" }
skainet-transformers-inference-llama = { module = "sk.ainet.transformers:skainet-transformers-inference-llama" }
skainet-transformers-runtime-kllama = { module = "sk.ainet.transformers:skainet-transformers-runtime-kllama" }
skainet-backend-cpu = { module = "sk.ainet.core:skainet-backend-cpu" }
skainet-backend-native-cpu = { module = "sk.ainet.core:skainet-backend-native-cpu" }
skainet-compile-dag = { module = "sk.ainet.core:skainet-compile-dag" }
skainet-compile-hlo = { module = "sk.ainet.core:skainet-compile-hlo" }
skainet-compile-opt = { module = "sk.ainet.core:skainet-compile-opt" }
skainet-io-core = { module = "sk.ainet.core:skainet-io-core" }
skainet-io-gguf = { module = "sk.ainet.core:skainet-io-gguf" }
skainet-lang-core = { module = "sk.ainet.core:skainet-lang-core" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-io-core = { module = "org.jetbrains.kotlinx:kotlinx-io-core", version.ref = "kotlinx-io" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
